<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos - GameVerse 3D</title>

    <link rel="stylesheet" href="css/styles.css">

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <header>
        <h1>🎮 GameVerse 3D</h1>
        <p class="hook">Explora tus juegos favoritos en 3D con modelos creados en Blender.</p>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sebas.html">Consolas</a></li>
                <li><a href="juegos.html" class="active">Juegos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contenedor contenedor-amarillo">
            <h2>Modelo 3D del Juego</h2>
            <p>Aquí puedes visualizar tu modelo exportado desde Blender (.glb).</p>
        </section>

        <section class="contenedor contenedor-verde">
            <div id="scene-container"></div>
        </section>
    </main>

    <footer class="contenedor contenedor-rojo">
        <p>© 2025 GameVerse 3D | Página de Juegos - Sebas</p>
    </footer>

    <script>
        // Escena
        const scene = new THREE.Scene();

        // Cámara
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        // Renderizador
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth * 0.8, window.innerHeight * 0.6);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById("scene-container").appendChild(renderer.domElement);

        // Controles
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Luces
        const light = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(light);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Cargar modelo 3D
        const loader = new THREE.GLTFLoader();
        loader.load(
            'models/juego.glb',  // ⚠️ CAMBIA ESTE NOMBRE por tu archivo
            function (gltf) {
                const model = gltf.scene;
                model.scale.set(1.5, 1.5, 1.5); // cambia el tamaño si es necesario
                scene.add(model);

                // Animación
                function animate() {
                    requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                }
                animate();
            },
            undefined,
            function (error) {
                console.error("Error cargando el modelo 3D:", error);
            }
        );

        // Ajustar a ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * 0.8, window.innerHeight * 0.6);
        });
    </script>
</body>
</html>
