<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Modelo 3D - GTA V</title>

    <style>
        body { margin: 0; overflow: hidden; }
        #threeD-container {
            width: 100vw;
            height: 100vh;
        }
        .btn-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: orange;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            z-index: 10;
            font-size: 18px;
        }
        .info-consola {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            border-radius: 12px;
            font-family: Arial, sans-serif;
            text-align: right;
            z-index: 20;
        }

        .info-consola h2 {
            margin: 0;
            font-size: 24px;
            color: #00ffcc;
        }

        .info-consola p {
            margin: 5px 0 0 0;
            font-size: 18px;
        }
    </style>

    <!-- IMPORTMAP -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
            "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js",
            "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js"
        }
    }
    </script>
</head>

<body>
    <div class="info-consola">
        <h2>GTA5</h2>
        <p>Precio: <strong>70€</strong></p>
    </div>
    <a class="btn-volver" href="juegos.html">← Volver</a>

    <div id="threeD-container"></div>

    <script type="module" src="gta5.js"></script>
</body>
</html>
